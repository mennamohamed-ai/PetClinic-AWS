<svg class="dog-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Body -->
            <ellipse cx="80" cy="105" rx="38" ry="28" fill="#e8f1fb" stroke="#3276BD" stroke-width="2"></ellipse>
            <!-- Head -->
            <circle cx="80" cy="68" r="26" fill="#e8f1fb" stroke="#3276BD" stroke-width="2"></circle>
            <!-- Left ear floppy -->
            <ellipse cx="60" cy="52" rx="12" ry="18" fill="#b5d4f4" stroke="#3276BD" stroke-width="2" transform="rotate(-20 60 52)"></ellipse>
            <!-- Right ear floppy -->
            <ellipse cx="100" cy="52" rx="12" ry="18" fill="#b5d4f4" stroke="#3276BD" stroke-width="2" transform="rotate(20 100 52)"></ellipse>
            <!-- Eyes -->
            <circle cx="72" cy="65" r="4.5" fill="#1a2d45"></circle>
            <circle cx="88" cy="65" r="4.5" fill="#1a2d45"></circle>
            <circle cx="73.5" cy="63.5" r="1.5" fill="white"></circle>
            <circle cx="89.5" cy="63.5" r="1.5" fill="white"></circle>
            <!-- Nose -->
            <ellipse cx="80" cy="74" rx="5" ry="3.5" fill="#3276BD"></ellipse>
            <!-- Mouth -->
            <path d="M75 78 Q80 83 85 78" stroke="#3276BD" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
            <!-- Tongue -->
            <ellipse cx="80" cy="83" rx="4" ry="3" fill="#46CEAC" opacity=".9"></ellipse>
            <!-- Tail wagging -->
            <path d="M118 100 Q138 85 132 70" stroke="#3276BD" stroke-width="3" fill="none" stroke-linecap="round">
              <animateTransform attributeName="transform" type="rotate" from="-10 118 100" to="15 118 100" dur="0.5s" repeatCount="indefinite" additive="sum"></animateTransform>
            </path>
            <!-- Front legs -->
            <rect x="60" y="125" width="12" height="22" rx="6" fill="#e8f1fb" stroke="#3276BD" stroke-width="2"></rect>
            <rect x="88" y="125" width="12" height="22" rx="6" fill="#e8f1fb" stroke="#3276BD" stroke-width="2"></rect>
            <!-- Paws -->
            <ellipse cx="66" cy="148" rx="8" ry="5" fill="#b5d4f4" stroke="#3276BD" stroke-width="1.5"></ellipse>
            <ellipse cx="94" cy="148" rx="8" ry="5" fill="#b5d4f4" stroke="#3276BD" stroke-width="1.5"></ellipse>
            <!-- Collar -->
            <rect x="64" y="88" width="32" height="7" rx="3.5" fill="#46CEAC" opacity=".9"></rect>
            <circle cx="80" cy="91" r="3" fill="#3276BD"></circle>
          </svg>