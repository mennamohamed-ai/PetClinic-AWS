# Production Backend Configuration with CloudWatch Integration

server.port=${SERVER_PORT:9090}
server.servlet.context-path=/api

spring.application.name=main-service

# Eureka Service Discovery Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${HOSTNAME:backend-instance}
eureka.instance.instance-id=${HOSTNAME:backend-instance}:${SERVER_PORT:9090}
eureka.instance.prefer-ip-address=false
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Database Configuration (AWS RDS)
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_URL}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator - Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CloudWatch Metrics Export
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.namespace=petclinic/backend
management.metrics.export.cloudwatch.step=60s

# Logging Configuration
logging.level.root=INFO
logging.level.com.clinic.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG

# JWT Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.cookie.same-site=${SECURITY_COOKIE_SAMESITE:Strict}

# Environment
app.name=PetClinic Backend
app.version=1.0.0
app.environment=${ENVIRONMENT:prod}
