name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 515060545576.dkr.ecr.us-east-1.amazonaws.com
  ENVIRONMENT: prod 
  S3_BUCKET: petclinic-prod-frontend-assets-515060545576
  CLOUDFRONT_ID: E8ZRDXZX46Q4G

jobs:
  # ============ Build and Push Docker Images ============
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    strategy:
      fail-fast: false 
      matrix:
        # شيلنا الـ frontend من هنا عشان هنعمله معاملة خاصة للـ S3
        service: [backend, api-gateway, ml-service, eureka-server]
        include:
          - service: backend
            dockerfile: Backend/Dockerfile
            context: ./Backend
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: . 
          - service: ml-service
            dockerfile: ml-service/Dockerfile
            context: ./ml-service
                 - service: eureka-server
            dockerfile: eureka-server/Dockerfile
            context: ./eureka-server

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515060545576:role/GitHubActionsRole
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }} 
          tags: |
            ${{ env.ECR_REGISTRY }}/petclinic-prod-${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/petclinic-prod-${{ matrix.service }}:latest
          push: true

  # ============ Special Job for Frontend (S3 Deploy) ============
  frontend-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./Frontend
        env:
          
          VITE_APP_API_URL: https://d1wv2cuj9zac3d.cloudfront.net
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515060545576:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Deploy to S3
        # السطر ده هو اللي هيملى الـ Bucket الفاضي بملفات الـ dist
        run: aws s3 sync Frontend/dist s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_ID }} --paths "/*"

  # ============ Deploy to ECS ============
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515060545576:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Deploy Services to ECS
        run: |
                 aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-eureka-server --force-new-deployment --region us-east-1
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-api-gateway --force-new-deployment --region us-east-1
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-backend-service --force-new-deployment --region us-east-1
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-ml-service --force-new-deployment --region us-east-1
