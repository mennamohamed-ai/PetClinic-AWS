name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 515060545576.dkr.ecr.us-east-1.amazonaws.com
  ENVIRONMENT: prod 

jobs:
  # ============ Build and Push Docker Images ============
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    strategy:
      fail-fast: false 
      matrix:
        service: [backend, api-gateway, ml-service, frontend]
        include:
          - service: backend
            dockerfile: Backend/Dockerfile
            context: ./Backend
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: . 
          - service: ml-service
            dockerfile: ml-service/Dockerfile
            context: ./ml-service
          - service: frontend
            dockerfile: Frontend/Dockerfile
            context: ./Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515060545576:role/GitHubActionsRole
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          # تعديل: بما أننا داخل الفولدر، نستخدم Dockerfile مباشرة
          file: ${{ matrix.dockerfile }} 
          tags: |
            ${{ env.ECR_REGISTRY }}/petclinic-prod-${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/petclinic-prod-${{ matrix.service }}:latest
          push: true

  # ============ Deploy to ECS ============
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515060545576:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Deploy Services to ECS
        run: |
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-backend-service --force-new-deployment --region us-east-1
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-api-gateway-service --force-new-deployment --region us-east-1
          aws ecs update-service --cluster petclinic-prod-cluster --service petclinic-prod-ml-service --force-new-deployment --region us-east-1

      - name: Update CloudFront for Frontend
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='petclinic-prod-cloudfront'].Id" --output text --region us-east-1)
          if [ "$DISTRIBUTION_ID" != "None" ] && [ ! -z "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*" --region us-east-1
          fi
